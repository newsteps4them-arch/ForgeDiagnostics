name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (e.g., 1.0.1)'
        required: false
        default: 'auto'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Release Version
        id: version
        run: |
          BASE_VERSION=$(node -e "try { console.log(require('./package.json').version || '1.0.0'); } catch(e) { console.log('1.0.0'); }")
          BUILD_NUM=${{ github.run_number }}
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [ "${{ github.event.inputs.version }}" != "" ] && [ "${{ github.event.inputs.version }}" != "auto" ]; then
            FINAL_VERSION="${{ github.event.inputs.version }}"
          else
            FINAL_VERSION="${BASE_VERSION}.${BUILD_NUM}"
          fi

          echo "version=$FINAL_VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build APK and App Bundle
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Locate and Rename Artifacts
        run: |
          mkdir -p artifacts
          
          # Find and copy Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "artifacts/Forge-debug-${{ steps.version.outputs.version }}.apk"
            echo "Found debug APK: $DEBUG_APK"
          else
            echo "Warning: Debug APK not found"
          fi
          
          # Find and copy Release APK  
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "artifacts/Forge-release-unsigned-${{ steps.version.outputs.version }}.apk"
            echo "Found release APK: $RELEASE_APK"
          else
            echo "Warning: Release APK not found"
          fi
          
          # Find and copy Release AAB
          RELEASE_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$RELEASE_AAB" ]; then
            cp "$RELEASE_AAB" "artifacts/Forge-production-release-${{ steps.version.outputs.version }}.aab"
            echo "Found release AAB: $RELEASE_AAB"
          else
            echo "Warning: Release AAB not found"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Forge-debug-${{ steps.version.outputs.version }}.apk
            artifacts/Forge-release-unsigned-${{ steps.version.outputs.version }}.apk
            artifacts/Forge-production-release-${{ steps.version.outputs.version }}.aab
          tag_name: v${{ steps.version.outputs.version }}
          name: "Forge Diagnostics v${{ steps.version.outputs.version }}"
          make_latest: true
          body: |
            # 🏎️ Forge Diagnostics Native Android OTA Release (v${{ steps.version.outputs.version }})
            
            **Version:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ steps.version.outputs.short_sha }}
            **Build Number:** ${{ github.run_number }}
            
            ## 📦 Downloadable Assets
            - 📲 **Pre-signed Debug APK (Auto-Update Enabled):** `Forge-debug-${{ steps.version.outputs.version }}.apk`
            - 🔑 **Unsigned Production Release APK:** `Forge-release-unsigned-${{ steps.version.outputs.version }}.apk`
            - 🚀 **Google Play App Bundle (AAB):** `Forge-production-release-${{ steps.version.outputs.version }}.aab`
            
            ## ⚡ Direct 1-Step Installation & In-App Auto-Update
            - Devices with Forge Diagnostics installed will automatically prompt for update on startup when connected to network!
            - Or download `Forge-debug-${{ steps.version.outputs.version }}.apk` directly onto your Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs and AAB as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-production-ready-artifacts
          path: artifacts/*
          retention-days: 30
