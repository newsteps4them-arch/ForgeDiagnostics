name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: false
        default: 'auto'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Get version
        id: version
        run: |
          VERSION=$(node -e "try { console.log(require('./package.json').version || '1.0.0'); } catch(e) { console.log('1.0.0'); }")
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Build APK and App Bundle
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Locate and Rename Artifacts
        run: |
          mkdir -p artifacts
          
          # Find and copy Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "artifacts/Forge-debug-${{ steps.version.outputs.version }}.apk"
            echo "Found debug APK: $DEBUG_APK"
          else
            echo "Warning: Debug APK not found"
          fi
          
          # Find and copy Release APK  
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "artifacts/Forge-release-unsigned-${{ steps.version.outputs.version }}.apk"
            echo "Found release APK: $RELEASE_APK"
          else
            echo "Warning: Release APK not found"
          fi
          
          # Find and copy Release AAB
          RELEASE_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$RELEASE_AAB" ]; then
            cp "$RELEASE_AAB" "artifacts/Forge-production-release-${{ steps.version.outputs.version }}.aab"
            echo "Found release AAB: $RELEASE_AAB"
          else
            echo "Warning: Release AAB not found"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Forge-debug-${{ steps.version.outputs.version }}.apk
            artifacts/Forge-release-unsigned-${{ steps.version.outputs.version }}.apk
            artifacts/Forge-production-release-${{ steps.version.outputs.version }}.aab
          tag_name: v${{ steps.version.outputs.version }}
          name: "Forge Diagnostics v${{ steps.version.outputs.version }}"
          make_latest: true
          body: |
            # 🏎️ Forge Diagnostics Native Android Release (v${{ steps.version.outputs.version }})
            
            **Version:** ${{ steps.version.outputs.version }}
            
            ## 📦 Downloadable Assets
            - 📲 **Pre-signed Debug APK (Install Directly):** `Forge-debug-${{ steps.version.outputs.version }}.apk`
            - 🔑 **Unsigned Production Release APK:** `Forge-release-unsigned-${{ steps.version.outputs.version }}.apk`
            - 🚀 **Google Play App Bundle (AAB):** `Forge-production-release-${{ steps.version.outputs.version }}.aab`
            
            ## ⚡ Direct 1-Step Installation
            1. Download `Forge-debug-${{ steps.version.outputs.version }}.apk` directly onto your Android device or diagnostic tool.
            2. Tap the downloaded file and select **Install**.
            *(If prompted, enable "Install from unknown sources" in device Settings).*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs and AAB as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-production-ready-artifacts
          path: artifacts/*
          retention-days: 30

