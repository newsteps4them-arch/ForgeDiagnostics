name: Forge Diagnostics Test Matrix

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  portable:
    name: Portable protocol and simulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run portable test routine
        run: bash scripts/run_all_tests.sh artifacts/portable-test-results.md
      - name: Upload portable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-portable-test-report
          path: artifacts/portable-test-results.md
          retention-days: 30

  android:
    name: Android JVM tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  report:
    name: Publish test summary
    if: always()
    needs: [portable, android]
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        run: |
          {
            echo "## ForgeDiagnostics test matrix"
            echo ""
            echo "- Portable job: **${{ needs.portable.result }}**"
            echo "- Android job: **${{ needs.android.result }}**"
            echo "- HIL and real-vehicle tests remain environment-gated and are not inferred from CI."
          } >> "$GITHUB_STEP_SUMMARY"
