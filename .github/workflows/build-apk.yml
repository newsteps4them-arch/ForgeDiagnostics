name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Gradle Compile (All Targets)
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Organize Artifacts
        run: |
          mkdir -p artifacts
          
          # Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then cp "$DEBUG_APK" "artifacts/Forge-debug.apk"; fi
          
          # Release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then cp "$RELEASE_APK" "artifacts/Forge-release-unsigned.apk"; fi
          
          # Release AAB (App Bundle)
          RELEASE_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$RELEASE_AAB" ]; then cp "$RELEASE_AAB" "artifacts/Forge-production-release.aab"; fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-ci-build-artifacts
          path: artifacts/*
          retention-days: 14

