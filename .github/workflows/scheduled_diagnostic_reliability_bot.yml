name: Scheduled Diagnostic Reliability Bot

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  push:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic-reliability-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai requests --quiet
          npm ci --ignore-scripts --no-audit --no-fund || npm install

      - name: Run Diagnostic Data Reliability & Accuracy Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/scheduled_reliability_bot.py

      - name: Upload Diagnostic Reliability Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-reliability-report
          path: DIAGNOSTIC_RELIABILITY_REPORT.md
          retention-days: 30
